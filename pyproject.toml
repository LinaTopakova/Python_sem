[project]
name = "food-diary"
version = "0.1.0"
description = "Дневник питания с ML-распознаванием еды"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "flask-sqlalchemy>=3.1",
    "werkzeug>=3.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["flask_app", "fastapi_app"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["migrations/", ".venv/"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.15",
]
